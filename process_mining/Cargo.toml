[package]
name = "process_mining"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Process Mining library for working with (object-centric) event data"
homepage = "https://rust4pm.aarkue.eu"
repository = "https://github.com/aarkue/rust4pm"
documentation = "https://docs.rs/process_mining/"
readme = "README.md"
keywords = ["process-mining"]
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
macros_process_mining = { version = "0.6.0", path = "../macros_process_mining" }
chrono = { version = "0.4.40", features = ["serde"] }
duckdb = { version = "1.2.1", optional = true, features = ["chrono"]}
flate2 = "1.1.1"
graphviz-rust = { version = "0.9.3", optional = true }
itertools = { version = "0.14.0" }
kuzu = {version = "=0.11.2", optional = true}
nalgebra = { version = "0.33.2", optional = true }
ordered-float = "5.0.0"
petgraph = "0.8.1"
polars = { version = "0.51.0", features = ["dtype-slim", "timezones", "partition_by"], optional = true }
quick-xml = { version = "0.37.4" }
rand = { version = "0.9.1", optional = true }
rayon = "1.7.0"
regex = { version = "1.11", optional = true }
rusqlite = { version = "0.38.0", features = ["bundled","chrono", "serialize", "column_decltype"], optional = true }
serde_json = "1.0.105"
serde = {version = "1.0.188", features = ["derive"]}
serde_with = { version = "3.16.0", features = ["std", "macros", "schemars_1"]}
tempfile = "3"
uuid = {version = "1.16.0", features = ["v4", "serde"]}
schemars = { version = "1.1.0", features = ["chrono04", "uuid1"]}
inventory = { version = "0.3", optional = true }
# Only for the `bytes` form of a registry-reference argument, which is how a host with no
# filesystem (a browser) hands a log over.
base64 = { version = "0.22", optional = true }
csv = "1.4.0"
# No backend features here: which ones are on is decided by this crate's own `extraction-dbcon*`
# features, because they are not all portable. `dbcon`'s `default` is `[]` and a `dbcon` with no
# backend recognises no connection string at all, so at least one must be selected.
dbcon = { git = "https://github.com/aarkue/dbcon.git", branch = "main", optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
hashbrown = "0.17.1"
rustc-hash = "2.1.2"
zip = { version = "6", default-features = false, features = ["deflate"], optional = true }
# `default-features = false` drops the `arrow` integration, which this does not use: the bundled
# format's column types are written through the low-level row-group writer. `zstd` is needed
# because `parquet`'s writers default to *no* block compression, which made an exported container
# several times larger than the same log as CSV; `parquet`'s own docs recommend ZSTD as the best
# balance of ratio, speed and ecosystem support.
# `snap` is on the read side: Snappy is what most other parquet writers emit by default, so a
# container produced elsewhere is unreadable without it.
parquet = { version = "58", default-features = false, features = [
    "zstd",
    "snap",
], optional = true }
# Only to hand `parquet` an in-memory `ChunkReader`; `parquet` already depends on it.
bytes = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
dhat = "0.3.3"

[build-dependencies]
# Pin cxx-build to match kuzu's cxx; bump this together with the kuzu dependency.
cxx-build = { version = "=1.0.138", optional = true }

[features]
# Enables exporting Petri nets as PNG/SVG/... images using graphviz.
# Note: graphviz needs to be locally installed to the PATH for the image export functions to work.
graphviz-export = ["dep:graphviz-rust"]

# Enables OCEL 2.0 SQLite/DuckDB import and export functionality
# Note: this might not work on certain architectures or machines if SQLite is not available/cannot be build
ocel-sqlite = ["dep:rusqlite"]
ocel-duckdb = ["dep:duckdb"]

# Enables the relational-to-OCEL extraction blueprint model, validation, SQL compiler,
# extractor and sinks.
#
# Carries no connector dependency of its own: `ocel-sqlite` brings `SqliteRowProvider`, and
# `extraction-dbcon` brings the `PostgreSQL`/CSV/Parquet one.
extraction-blueprint = ["dep:regex"]

# Adds `DbconRowProvider`, a `RowProvider` over the file-backed sources `dbcon` reads -- SQLite,
# CSV and Parquet -- and the extraction bindings that open one.
#
# Deliberately excludes PostgreSQL: that is `extraction-dbcon-postgres` below. These three build
# for `wasm32-unknown-unknown` (`dbcon` substitutes `sqlite-wasm-rs` there) and can be read from
# bytes with no filesystem, which is what a browser has. Bundling PostgreSQL in here forced
# `sqlx` and its runtime into every build that wanted to read a dropped CSV, and so kept the
# whole connector off the browser.
#
# `dbcon` has no crates.io release, so enabling this feature's dependency makes the crate
# unpublishable until it does -- which is why it is optional and off by default.
extraction-dbcon = [
    "dep:dbcon",
    "dep:tokio",
    "extraction-blueprint",
    "dbcon/sqlite",
    "dbcon/csv",
    "dbcon/parquet",
    # Pure Rust and byte-readable, so it belongs with the wasm-capable three rather than behind an
    # opt-in like DuckDB/PostgreSQL.
    "dbcon/xlsx",
]

# Adds PostgreSQL to `extraction-dbcon`. Separate because `sqlx` does not build for
# `wasm32-unknown-unknown`, and because a server connection is meaningless from a browser page.
extraction-dbcon-postgres = ["extraction-dbcon", "dbcon/postgres"]

# Adds DuckDB to `extraction-dbcon`. Separate for the same reason as PostgreSQL: the `duckdb`
# crate links a native library and does not build for `wasm32`, so it must not be dragged into a
# build that only wants to read a dropped CSV. Links against a system `libduckdb`; pair it with
# `dbcon/duckdb-bundled` to build DuckDB from source instead.
extraction-dbcon-duckdb = ["extraction-dbcon", "dbcon/duckdb"]

# Enables reading and writing the OCEL 2.0 bundled CSV/Parquet format: a `.ocel.zip` archive or
# a directory with the same layout, with CSV storage.
ocel-bundle = ["dep:zip"]

# Adds Parquet storage to `ocel-bundle`. Separate because `parquet` is a large dependency and
# a CSV container needs none of it.
ocel-bundle-parquet = ["ocel-bundle", "dep:parquet", "dep:bytes"]

# Enables polars DataFrame conversion from/to event data structs
dataframes = ["dep:polars"]

# Enables kuzudb features for OCEL (e.g., exporting OCEL to kuzudb database)
kuzudb = ["dep:kuzu", "dep:cxx-build"]

# Enables event log splitting (+rand dependency)
log-splitting = ["dep:rand"]

# Enables algebraic functionality
token-based-replay = ["dep:nalgebra"]

# Enable bindings
bindings = [
   "dep:inventory",
   "dep:base64"
]

all = ["graphviz-export","ocel-sqlite","ocel-duckdb","extraction-blueprint","extraction-dbcon","extraction-dbcon-postgres","extraction-dbcon-duckdb","ocel-bundle","ocel-bundle-parquet","dataframes","kuzudb", "log-splitting", "token-based-replay", "bindings" ]

[package.metadata.docs.rs]
# Not `all-features`: `all` pulls in `extraction-dbcon`, whose `dbcon` dependency is a local path.
features = [
    "graphviz-export",
    "ocel-sqlite",
    "ocel-duckdb",
    "extraction-blueprint",
    "ocel-bundle",
    "ocel-bundle-parquet",
    "dataframes",
    "kuzudb",
    "log-splitting",
    "token-based-replay",
    "bindings",
]

[[example]]
name = "ocel_kuzudb_export"
required-features = ["dataframes", "kuzudb"]

[[example]]
name = "ocel_duckdb_export"
required-features = ["ocel-duckdb"]

[[bench]]
name = "load_dataframe"
harness = false
required-features = ["dataframes"]

[[bench]]
name = "load_dataframe_mem"
harness = false
required-features = ["dataframes"]

[[bench]]
name = "load_events"
harness = false

[[bench]]
name = "load_events_mem"
harness = false

[[bench]]
name = "alignments"
harness = false

[[bench]]
name = "ocel_import"
harness = false
required-features = ["ocel-duckdb"]

[[example]]
name = "ocel_stream_to_duckdb"
required-features = ["ocel-duckdb"]

[[example]]
name = "ocel_dataset_crosscheck"
required-features = ["ocel-bundle-parquet"]

[[example]]
name = "deposit_artifacts"
required-features = ["bindings"]

[[example]]
name = "schema_census"
required-features = ["bindings"]

[[bench]]
name = "ocel_access"
harness = false

[[bench]]
name = "ocel_duckdb_latency"
harness = false
required-features = ["ocel-duckdb"]

[[bench]]
name = "ocel_query_pushdown"
harness = false
required-features = ["ocel-duckdb"]
